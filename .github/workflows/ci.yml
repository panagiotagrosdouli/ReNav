name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,plots]'
      - run: pytest -q
      - run: ruff check renav tests experiments
      - run: python experiments/run_mechanistic_sweep.py --trials 10000 --seed 20260924
      - run: python publication/plot_mechanistic_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: renav-mechanistic-sweep-${{ github.sha }}
          path: |
            results/*.csv
            publication/figures/mechanistic_sweep.svg
          if-no-files-found: error
          retention-days: 90
